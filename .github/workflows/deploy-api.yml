name: Deploy the API

# The Express application, deployed to Vercel.
#
# The build command is in vercel.json: it generates the Prisma client, applies
# the migrations, and builds the serverless entry that serves the API.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time, and the migration in the build must not run
# against a database another deployment is already changing.
concurrency:
  group: api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Deploy
        # The CLI is called directly rather than through an action: the
        # action reads the account behind the token after it has deployed,
        # which a token scoped to a project cannot ("User not found"), and
        # the run fails on that rather than on the deployment.
        run: npx vercel@latest deploy --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
