name: Build the Android app

# The APK, for a beta on a real device.
#
# The app is signed with the release key, which is never in the repository:
# the workflow restores it from a secret, signs the build, and publishes the
# APK as a release asset.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The API the app talks to, baked into the bundle.
      VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      # The captcha's site key, baked into the bundle.
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle's plugin needs Java 21. A newer JDK fails to read the
          # plugin's class files.
          java-version: '21'

      - name: Install
        run: npm ci

      - name: Bundle the app
        run: npm run app:build

      - name: Copy the bundle into the Android project
        run: npm run android:sync

      - name: Restore the signing key
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/event-invites-release.jks

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/event-invites-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
