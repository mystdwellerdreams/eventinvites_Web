name: Build the Android app

# The APK, for a beta on a real device.
#
# The app is signed with the release key, which is never in the repository:
# the workflow restores it from a secret, signs the build, and publishes the
# APK as a release asset.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The API the app talks to, baked into the bundle.
      VITE_API_BASE: ${{ vars.VITE_API_BASE }}
      # The captcha's site key, baked into the bundle.
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Gradle's plugin needs Java 21. A newer JDK fails to read the
          # plugin's class files.
          java-version: '21'

      - name: Install
        run: npm ci

      - name: Bundle the app
        run: npm run app:build

      - name: Copy the bundle into the Android project
        run: npm run android:sync

      - name: Write the Firebase configuration
        # Without this the app has no Firebase project, asks for no push
        # token, and every notification goes nowhere. The file names the
        # Firebase app, the sender and the API key, and it is not secret —
        # but it is not in the repository either, so it comes from a secret.
        run: |
          echo '${{ secrets.FCM_GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Set the version
        # The code is what the installer compares against, so it is the run
        # number: it never goes backwards, and a build always installs over
        # the last one. The name is the release tag, so the app reports which
        # build it is and the server can tell two devices apart.
        #
        # The run number counts only this workflow's runs, and a build made
        # by hand can be ahead of it — the code in the repository is the
        # floor, so a release never asks a phone to go backwards and has to
        # be uninstalled first.
        run: |
          # The tag is the release's name; the version the app reports is
          # the same name without its v, the way the builds made by hand are
          # named.
          VERSION_NAME="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}"
          VERSION_NAME="${VERSION_NAME#v}"
          RUN_CODE="${{ github.run_number }}"
          REPO_CODE="$(sed -n 's/^ *versionCode *\([0-9][0-9]*\).*/\1/p' android/app/build.gradle)"
          VERSION_CODE="$RUN_CODE"
          if [ -n "$REPO_CODE" ] && [ "$REPO_CODE" -gt "$VERSION_CODE" ]; then
            VERSION_CODE="$REPO_CODE"
          fi
          echo "building $VERSION_NAME ($VERSION_CODE)"
          sed -i.bak \
            -e "s/^\( *\)versionCode .*/\1versionCode $VERSION_CODE/" \
            -e "s/^\( *\)versionName .*/\1versionName \"$VERSION_NAME\"/" \
            android/app/build.gradle
          rm -f android/app/build.gradle.bak
          grep -E "version(Code|Name)" android/app/build.gradle

      - name: Check the signing material
        # Without the key the build still succeeds — it produces an APK that
        # cannot be installed — and the release would offer it to everyone
        # whose app says there is an update. The run stops here instead, and
        # says what is missing.
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::the signing material is missing. ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD have to be set as repository secrets."
            exit 1
          fi
          echo "the signing material is there"

      - name: Restore the signing key
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/event-invites-release.jks

      - name: Work out the key's password
        # A key store has a password, and the key inside it can have
        # another — except in a PKCS12 store, which keeps only one, so the
        # two secrets are usually the same value and sometimes only one of
        # them was set to it. Whichever opens the store is the password the
        # signing uses, and the key is read with it too.
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/event-invites-release.jks
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE_PASSWORD" > /dev/null 2>&1; then
            STORE="$STORE_PASSWORD"
            echo "the store password opens the key store"
          elif keytool -list -keystore "$KEYSTORE_FILE" -storepass "$KEY_PASSWORD" > /dev/null 2>&1; then
            STORE="$KEY_PASSWORD"
            echo "the key password opens the key store, so that is the password of both"
          else
            echo "::error::neither ANDROID_KEYSTORE_PASSWORD nor ANDROID_KEY_PASSWORD opens the key store. The password of the key store is needed to sign with it."
            exit 1
          fi
          echo "the aliases in the store:"
          keytool -list -keystore "$KEYSTORE_FILE" -storepass "$STORE" | sed -n 's/^ *\([A-Za-z0-9._-]*\),\(.*\)/  \1\2/p'
          if keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$STORE" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" > /dev/null 2>&1; then
            KEY="$KEY_PASSWORD"
          else
            KEY="$STORE"
            echo "the key is read with the store's password"
          fi
          echo "ANDROID_KEYSTORE_PASSWORD=$STORE" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/event-invites-release.jks
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        # The passwords come from the step above, which worked out which of
        # them opens the key store. The wrapper is in the repository with
        # its executable bit, and it is made executable here as well: a
        # checkout that lost the bit would stop the release with
        # "Permission denied".
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
