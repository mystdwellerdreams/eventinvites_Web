name: Deploy to Cloudflare

# The Worker, its static assets and the database migrations all move together:
# a deploy that runs against a schema the Worker does not expect would answer
# every request with an error, so the migration goes first.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time. A second push while the first is still running waits
# rather than racing it.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # The site's own secret key for the captcha, baked into the bundle.
      VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
      # The direct connection to the database, for the migrations. The Worker
      # itself reaches the database through Hyperdrive, which cannot run them.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck && npm run worker:typecheck

      - name: Build the web app
        run: npm run web:build

      - name: Apply the database migrations
        run: npm run db:deploy

      - name: Deploy the Worker
        uses: cloudflare/wrangler-action@v3
        with:
          # The migrations above and the deploy below must not run at the same
          # time, so the deploy waits for them.
          command: deploy
          # The Worker is in wrangler.jsonc; only the account is given here.
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
